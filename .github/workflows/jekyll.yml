  name: Build and Deploy Jekyll Site

  on:
    push:
      branches: ["main"]
    workflow_dispatch:
    # Ogni ora: pubblica gli approfondimenti con «Esce sul sito» acceso e la data arrivata.
    # Se non c'è niente da pubblicare la build non parte (job «pubblica» qui sotto).
    schedule:
      - cron: "7 * * * *"

  permissions:
    contents: write
    pages: write
    id-token: write

  # Evita deploy concorrenti sullo stesso branch. Dal 2026-09-04 la conversione WebP
  # avviene qui dentro (vedi passo dedicato) e non esiste piu' un secondo workflow che
  # committa sul main, quindi non c'e' piu' nessuna race condition da serializzare.
  concurrency:
    group: "rossodisera-publish"
    cancel-in-progress: false

  jobs:
    # Approfondimenti (17/11/2026): dal CMS sono anteprime in _numeri/; arrivata la data
    # di pubblicazione con «Esce sul sito» acceso, lo script li sposta in _posts/approfondimenti/.
    pubblica:
      runs-on: ubuntu-latest
      if: github.actor != 'github-actions[bot]'
      outputs:
        fatti: ${{ steps.sposta.outputs.fatti }}
      steps:
        - name: Checkout
          uses: actions/checkout@v5
        - name: Sposta gli approfondimenti arrivati alla data
          id: sposta
          run: python3 scripts/pubblica_approfondimenti.py
        - name: Commit
          if: steps.sposta.outputs.fatti == '1'
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A _numeri _posts/approfondimenti
            git commit -m "Pubblica gli approfondimenti arrivati alla data"
            git pull --rebase origin main
            git push

    build:
      needs: pubblica
      runs-on: ubuntu-latest
      outputs:
        indexnow: ${{ steps.indexnow.outputs.corpo }}
      if: github.actor != 'github-actions[bot]' && (github.event_name != 'schedule' || needs.pubblica.outputs.fatti == '1')
      steps:
        - name: Checkout
          uses: actions/checkout@v5
          with:
            ref: main

        - name: Setup Ruby
          uses: ruby/setup-ruby@v1
          with:
            ruby-version: '3.3'
            bundler-cache: true

        - name: Fix smart quotes in front matter
          run: |
            python3 << 'PYTHON_SCRIPT'
            import os, re, json

            posts_dir = '_posts'
            replacements = {
                '\u201c': '"', '\u201d': '"',
                '\u2018': "'", '\u2019': "'",
                '\u200b': '', '\u200c': '', '\u200d': '', '\ufeff': '',
            }

            def fix_single_quoted_apostrophes(fm):
                """Re-quota gli scalari YAML single-quoted come stringhe double-quoted
                JSON-safe. Gestisce i valori che contengono apostrofi E virgolette doppie
                insieme (es. excerpt con l'inserimento e "Uccelli"), caso che la versione
                precedente saltava — lasciando il YAML rotto e la card vuota in home."""
                lines = fm.split('\n')
                result = []
                for line in lines:
                    m = re.match(r"^(\s*\w[\w_]*:\s*)'(.*)'(\s*)$", line)
                    if m:
                        key, value, trail = m.group(1), m.group(2), m.group(3)
                        # single-quoted è valido se ogni apostrofo interno è raddoppiato ('');
                        # se dopo aver rimosso le coppie resta un apostrofo singolo, il YAML è rotto.
                        if "'" in value.replace("''", ""):
                            unescaped = value.replace("''", "'")  # YAML: '' = apostrofo letterale
                            line = f'{key}{json.dumps(unescaped, ensure_ascii=False)}{trail}'
                    result.append(line)
                return '\n'.join(result)

            fixed = []

            for filename in os.listdir(posts_dir):
                if not filename.endswith('.md'):
                    continue
                path = os.path.join(posts_dir, filename)
                with open(path, encoding='utf-8') as f:
                    content = f.read()
                parts = content.split('---', 2)
                if len(parts) < 3:
                    continue
                fm = parts[1]
                fm_fixed = fm
                for bad, good in replacements.items():
                    fm_fixed = fm_fixed.replace(bad, good)
                fm_fixed = fix_single_quoted_apostrophes(fm_fixed)
                if fm_fixed != fm:
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write('---' + fm_fixed + '---' + parts[2])
                    fixed.append(filename)
                    print(f'Fixed: {filename}')

            if not fixed:
                print('No issues found.')
            PYTHON_SCRIPT

        - name: Commit smart quotes fix
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _posts/*.md
            if git diff --staged --quiet; then
              echo "Nothing to commit"
            else
              git commit -m "Fix: rimuove smart quotes dal front matter"
              git pull --rebase origin main
              git push
            fi

        - name: Genera i WebP mancanti e riscrive i riferimenti (solo per il build)
          run: |
            # 19/11/2026: se i server di Ubuntu non rispondono (503), si converte con Pillow da PyPI
            sudo apt-get install -y webp || python3 -m pip install --quiet --break-system-packages pillow
            python3 << 'PYTHON_SCRIPT'
            import os, re, subprocess, shutil
            CWEBP = shutil.which('cwebp')
            print('Conversione con', 'cwebp' if CWEBP else 'Pillow')

            # I .webp sono artefatti di build: si generano qui e NON vengono committati.
            # Il repo tiene le immagini originali caricate dal CMS, il sito serve i webp.
            # Prima erano prodotti da convert-webp.yml, che committava e pushava: quel push,
            # fatto con il GITHUB_TOKEN di default, non innescava un nuovo build (regola di
            # GitHub contro i loop), e il sito restava fermo al commit precedente, senza webp.
            UPLOADS = 'assets/images/uploads'
            ESTENSIONI = ('.jpg', '.jpeg', '.png')

            generati, gia_presenti = [], 0
            basi_con_webp = set()

            for nome in sorted(os.listdir(UPLOADS)):
                base, ext = os.path.splitext(nome)
                if ext.lower() not in ESTENSIONI:
                    continue
                webp = os.path.join(UPLOADS, base + '.webp')
                if os.path.exists(webp):
                    gia_presenti += 1
                else:
                    if CWEBP:
                        subprocess.run(['cwebp', '-quiet', '-q', '80',
                                        os.path.join(UPLOADS, nome), '-o', webp], check=True)
                    else:
                        from PIL import Image
                        Image.open(os.path.join(UPLOADS, nome)).save(webp, 'WEBP', quality=80)
                    generati.append(nome)
                basi_con_webp.add(base)

            print(f'WebP generati ora: {len(generati)} | gia presenti nel repo: {gia_presenti}')
            for n in generati:
                print(f'  + {n}')

            # Riscrive i riferimenti nei post: front matter, markdown e html insieme,
            # con o senza slash iniziale. Solo per le immagini che un .webp ce l'hanno.
            riferimento = re.compile(
                r'(assets/images/uploads/([^/\s"\'\)]+?))\.(jpe?g|png)\b',
                re.IGNORECASE,
            )

            def sostituisci(m):
                return m.group(0) if m.group(2) not in basi_con_webp else f'{m.group(1)}.webp'

            aggiornati = 0
            for filename in sorted(os.listdir('_posts')):
                if not filename.endswith('.md'):
                    continue
                path = os.path.join('_posts', filename)
                with open(path, encoding='utf-8') as f:
                    contenuto = f.read()
                nuovo = riferimento.sub(sostituisci, contenuto)
                if nuovo != contenuto:
                    with open(path, 'w', encoding='utf-8') as f:
                        f.write(nuovo)
                    aggiornati += 1
            print(f'Post con riferimenti riscritti per il build: {aggiornati}')
            PYTHON_SCRIPT

        # Approfondimenti scritti come documento unico (19/11/2026): il corpo diventa le caselle
        # che usa numero.html. Solo per il build, nel repo il file resta un documento.
        - name: Approfondimenti, dal documento alle caselle (solo per il build)
          run: |
            python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pyyaml
            python3 scripts/documento_approfondimento.py --applica _numeri _posts/approfondimenti

        - name: Cartoline social degli ultimi 20 articoli, per /social/ (solo per il build)
          continue-on-error: true
          run: |
            python3 -c "import PIL, yaml" 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow pyyaml
            python3 scripts/cartoline.py --ultimi 20 | tail -1

        - name: Setup Pages
          id: pages
          uses: actions/configure-pages@v5

        - name: Build with Jekyll
          run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          env:
            JEKYLL_ENV: production

        - name: IndexNow, URL nuovi o cambiati rispetto al sito online
          id: indexnow
          continue-on-error: true
          run: echo "corpo=$(python3 scripts/indexnow.py corpo _site/sitemap.xml)" >> "$GITHUB_OUTPUT"

        - name: Upload artifact
          uses: actions/upload-pages-artifact@v4

    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v5

        - name: IndexNow (Bing e gli altri), dopo la messa online
          if: needs.build.outputs.indexnow != ''
          continue-on-error: true
          env:
            CORPO: ${{ needs.build.outputs.indexnow }}
          run: |
            sleep 60
            curl -s -o /dev/null -w "IndexNow: risposta %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H "Content-Type: application/json; charset=utf-8" --data "$CORPO"

