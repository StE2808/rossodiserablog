# Configurazione Rosso di Sera Blog
title: "Rosso di Sera"
tagline: "Una luce nel mondo digitale"
description: "Blog editoriale italiano di politica, società e cultura: analisi critiche su Italia e mondo, diritti umani, ambiente e intelligenza artificiale."
url: "https://rossodiserablog.it"
baseurl: ""

# Author principale (per SEO)
author:
  name: "Lino Rialti & Stefano Vozzi"
  email: "s.vozzi@gmail.com"
  twitter: "@rossodiserablog"

# Logo per Schema.org
logo: "/assets/images/logo_trasparenza.png"

# Social profiles
social:
  name: "Rosso di Sera"
  links:
    - https://github.com/StE2808/rossodiserablog

# Impostazioni SEO
lang: it_IT
timezone: Europe/Rome

# Autori
collections:
  authors:
    output: true
  # Prove nascoste fatte a mano (solo da mostrare): gli approfondimenti veri sono post in _posts/approfondimenti/
  numeri:
    output: true
    permalink: /prove/:name/

# Build settings
markdown: kramdown
encoding: utf-8
permalink: /:title/

# Paginazione: tolta il 04/11/2026. La home mostra sempre gli ultimi 20 (site.posts),
# quindi /pagina/2..23/ erano copie identiche della home (audit Codex). La navigazione
# completa sta in /archivio/, che linka tutti gli articoli.

# Plugin
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Feed RSS
feed:
  path: feed.xml
  excerpt_only: false
  posts_limit: 250

# Defaults
defaults:
  # Approfondimenti (17/11/2026): post veri, quindi entrano da soli in archivio, categorie, feed, ricerca.
  # In home il più recente sta in copertina finché non esce il successivo (rivista-home.html).
  - scope:
      path: "_posts/approfondimenti"
      type: "posts"
    values:
      layout: "numero"
      approfondimento: true
      permalink: "/approfondimenti/:title/"
  - scope:
      path: ""
      type: "numeri"
    values:
      layout: "numero"
      prova: true
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      sitemap: true
      description: ""
      image_alt: ""
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      path: "terrata"
    values:
      sitemap: false
  - scope:
      path: "villa_rosa"
    values:
      sitemap: false
  - scope:
      path: "paroleinmusica"
    values:
      sitemap: false
  - scope:
      path: "rosso"
    values:
      sitemap: false

# Esclusioni
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - _dev
  - _docs
  - comments-worker
  - scripts
