backend:
  name: github
  repo: StE2808/rossodiserablog
  branch: main
  base_url: https://sveltia-cms-auth.s-vozzi.workers.dev

# publish_mode: editorial_workflow  (spento il 19/11/2026: «Salva» manda il pezzo al sito; gli approfondimenti restano anteprime nascoste finché «Esce sul sito» è spento)

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: 'it'

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Articoli"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "Titolo"
        name: "title"
        widget: "string"
        required: true
        hint: "Titolo editoriale dell'articolo. Può essere creativo."
      - label: "Titolo SEO (opzionale)"
        name: "seo_title"
        widget: "string"
        required: false
        hint: "Max 60 caratteri. Se vuoto, usa il titolo normale. Scrivi quello che l'utente cercherebbe su Google."
      - label: "Meta Description"
        name: "description"
        widget: "text"
        required: false
        hint: "120-155 caratteri. Riassumi l'articolo con una frase che invogli al click. Includi la parola chiave principale."
      - label: "Data pubblicazione"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        required: true
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
        required: true
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
        required: true
      - label: "Tag"
        name: "tags"
        widget: "list"
        required: false
      - label: "Immagine copertina"
        name: "image"
        widget: "image"
        required: false
        hint: "Immagine principale. Dimensioni ideali: 1200x630px per social sharing."
      - label: "Didascalia immagine"
        name: "image_caption"
        widget: "string"
        required: false
        hint: "Testo che appare sotto l'immagine (opzionale)"
      - label: "Alt Text Immagine"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Descrivi l'immagine per non vedenti e motori di ricerca. Non ripetere il titolo, descrivi cosa si VEDE."
      - label: "Sunto"
        name: "excerpt"
        widget: "text"
        required: true
        hint: "Anteprima che appare nelle card del sito e nel feed RSS. Può essere più lungo della Meta Description."
      - label: "Parola Chiave Principale (promemoria)"
        name: "focus_keyword"
        widget: "string"
        required: false
        hint: "Per quale ricerca vuoi posizionarti? Usala in: titolo SEO, description, primo paragrafo, almeno un H2."
      - label: "Contenuto"
        name: "body"
        widget: "markdown"
        required: true
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
          - code

  # GLI APPROFONDIMENTI (ex «numero del giovedì», 16-17/11/2026): scritti qui finiscono in _numeri/ come anteprima (/anteprima/<nome>/, noindex); con «Esce sul sito» e la data arrivata il workflow li sposta in _posts/approfondimenti/. Un modulo, il layout numero.html impagina da solo.
  - name: "numeri"
    label: "Approfondimenti"
    label_singular: "Approfondimento"
    description: "Ogni casella finisce in un punto preciso della pagina: [guarda lo schema](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg) (si apre in un'altra scheda)."
    folder: "_numeri"
    create: true
    slug: "{{slug}}"
    summary: "N. {{numero}} · {{title}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "numero" }
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: true }
      - { label: "Tema in breve", name: "tema_breve", widget: "string", hint: "Due o tre parole per la testata, es. «Il racket»." }
      - { label: "Titolo (meglio una domanda)", name: "title", widget: "string", hint: "Dove va ogni casella: [schema della pagina](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg)" }
      - { label: "Titolo SEO", name: "seo_title", widget: "string", required: false, hint: "Max 60 caratteri, le parole che la gente cerca." }
      - { label: "Meta description", name: "description", widget: "text", hint: "120-155 caratteri." }
      - { label: "Parola chiave principale", name: "focus_keyword", widget: "string", required: false }
      - { label: "Esce sul sito", name: "pubblica", widget: "boolean", default: false, required: false, hint: "Spento: resta un'anteprima (la vedi solo tu, all'indirizzo /anteprima/...). Acceso: esce sul sito alla data qui sotto, entro un'ora. Controlla l'anteprima prima di accenderlo." }
      - { label: "Data di pubblicazione", name: "data_pubblicazione", widget: "datetime", format: "YYYY-MM-DD HH:mm", required: false, hint: "Giorno e ora in cui esce. Si può anche programmare: se è nel futuro, aspetta quel momento." }
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        hint: "L'argomento: l'approfondimento compare anche lì, oltre che in copertina e fra gli arretrati. Senza categoria non esce."
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
      - { label: "Foto di copertina", name: "image", widget: "image", hint: "La seconda foto non sta qui: va nel testo, sotto ### Frase rossa, alla riga Foto:." }
      - { label: "Descrizione della foto (alt)", name: "image_alt", widget: "string", hint: "Cosa si vede, non il titolo." }
      - { label: "La foto è generata", name: "image_generata", widget: "boolean", default: true, hint: "Aggiunge «Illustrazione generata» sotto la foto." }
      - { label: "Didascalia (se la foto è vera)", name: "image_caption", widget: "string", required: false }
      - label: "Leggi anche"
        name: "leggi_anche"
        widget: "list"
        required: false
        max: 4
        hint: "Fino a quattro articoli. La categoria si mette da sola. Se vuoto, escono gli ultimi quattro articoli."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string" }
          - { label: "Indirizzo", name: "url", widget: "string", hint: "Es. /la-strana-parabola-della-silicon-valley/" }
      - label: "Il testo dell'approfondimento"
        name: "body"
        widget: "text"
        hint: "Tutto il pezzo qui, di seguito. Le righe che cominciano con ## e ### e le parole seguite dai due punti (Catenaccio:, Indice:, Foto:, Numero:...) dicono al sito dove va ogni cosa: lasciale e cambia il testo dopo. Frase rossa e Tabella vanno in fondo alla loro fascia; i blocchi che non servono si cancellano. Una voce di tabella sono quattro righe (Numero, Unità, Cosa, Fonte), separate da una riga vuota."
        default: |
          Catenaccio: una o due frasi sotto il titolo.
          Il punto: 25-50 parole, la tesi detta in chiaro (serve a Google e alle IA).

          ## Apertura: Titolo del tema
          Sottotitolo: la frase sotto il titolo del tema.

          Primo paragrafo dell'apertura (150-200 parole in tutto; la prima lettera diventa il capolettera).

          Secondo paragrafo.

          ## Capire: titolo della prima fascia, con le parole che si cercano
          Indice: la riga nell'indice
          Sommario: prima voce in copertina; seconda voce
          Colonne: 3

          ### Titolo del primo blocco
          Testo del blocco, 40-90 parole.

          ### Una domanda che la gente si fa?
          Se il titolo finisce col punto di domanda diventa una FAQ per Google. 40-60 parole.

          ### Frase rossa
          La frase grande,
          anche su due righe.
          Sotto: la riga piccola sotto la frase.
          Foto: /assets/images/numeri/nome-approfondimento/foto.jpg
          Descrizione foto: cosa si vede
          Foto generata: sì
          Didascalia: solo per le foto vere, con i crediti.

          ## Vedere: titolo della seconda fascia
          Indice: la riga nell'indice
          Sommario: prima voce; seconda voce

          ### Titolo del blocco
          Testo del blocco.

          ### Tabella: Titolo della tabella
          Didascalia: dove, quando, che unità.

          Numero: 28,7
          Unità: miliardi di euro
          Cosa: che cosa misura questo numero.
          Fonte: [nome della fonte](https://indirizzo), data

          Numero: 41,3
          Unità: miliardi di euro
          Cosa: che cosa misura.
          Fonte: [nome della fonte](https://indirizzo), data

          Limite: i limiti dei dati.

          ## Pensare: titolo della terza fascia
          Indice: la riga nell'indice
          Sommario: prima voce; seconda voce

          ### Titolo del blocco
          Testo del blocco.

          ## Domande
          - La prima domanda, quella grande?
          - La seconda?
          - La terza?
      - label: "Articolo da cui nasce (facoltativo)"
        name: "articolo_origine"
        widget: "object"
        required: false
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false }
          - { label: "Indirizzo", name: "url", widget: "string", required: false }

  # APPROFONDIMENTI USCITI (17/11/2026): per correggere un approfondimento già pubblicato.
  # Il file sta in _posts/approfondimenti/ (lo sposta scripts/pubblica_approfondimenti.py); niente «Nuovo»: si crea da «Approfondimenti».
  - name: "approfondimenti_usciti"
    label: "Approfondimenti usciti"
    label_singular: "Approfondimento uscito"
    description: "Gli approfondimenti già pubblicati, per correggerli. Quelli nuovi si scrivono in «Approfondimenti»."
    folder: "_posts/approfondimenti"
    create: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "N. {{numero}} · {{title}}"
    fields:
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: true }
      - { label: "Tema in breve", name: "tema_breve", widget: "string", hint: "Due o tre parole per la testata, es. «Il racket»." }
      - { label: "Titolo (meglio una domanda)", name: "title", widget: "string", hint: "Dove va ogni casella: [schema della pagina](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg)" }
      - { label: "Titolo SEO", name: "seo_title", widget: "string", required: false, hint: "Max 60 caratteri, le parole che la gente cerca." }
      - { label: "Meta description", name: "description", widget: "text", hint: "120-155 caratteri." }
      - { label: "Parola chiave principale", name: "focus_keyword", widget: "string", required: false }
      - { label: "Data di uscita", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss ZZ", hint: "Messa dal sito quando è uscito: non cambiarla." }
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        hint: "L'argomento: l'approfondimento compare anche lì, oltre che in copertina e fra gli arretrati. Senza categoria non esce."
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
      - { label: "Foto di copertina", name: "image", widget: "image", hint: "La seconda foto non sta qui: va nel testo, sotto ### Frase rossa, alla riga Foto:." }
      - { label: "Descrizione della foto (alt)", name: "image_alt", widget: "string", hint: "Cosa si vede, non il titolo." }
      - { label: "La foto è generata", name: "image_generata", widget: "boolean", default: true, hint: "Aggiunge «Illustrazione generata» sotto la foto." }
      - { label: "Didascalia (se la foto è vera)", name: "image_caption", widget: "string", required: false }
      - label: "Leggi anche"
        name: "leggi_anche"
        widget: "list"
        required: false
        max: 4
        hint: "Fino a quattro articoli. La categoria si mette da sola. Se vuoto, escono gli ultimi quattro articoli."
        fields:
          - { label: "Titolo", name: "titolo", widget: "string" }
          - { label: "Indirizzo", name: "url", widget: "string", hint: "Es. /la-strana-parabola-della-silicon-valley/" }
      - label: "Il testo dell'approfondimento"
        name: "body"
        widget: "text"
        hint: "Tutto il pezzo qui, di seguito. Le righe che cominciano con ## e ### e le parole seguite dai due punti (Catenaccio:, Indice:, Foto:, Numero:...) dicono al sito dove va ogni cosa: lasciale e cambia il testo dopo. Frase rossa e Tabella vanno in fondo alla loro fascia; i blocchi che non servono si cancellano. Una voce di tabella sono quattro righe (Numero, Unità, Cosa, Fonte), separate da una riga vuota."
      - label: "Articolo da cui nasce (facoltativo)"
        name: "articolo_origine"
        widget: "object"
        required: false
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false }
          - { label: "Indirizzo", name: "url", widget: "string", required: false }

  - name: "authors"
    label: "Autori"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Nome completo"
        name: "name"
        widget: "string"
        required: true
      - label: "Username"
        name: "username"
        widget: "string"
        required: true
      - label: "Bio"
        name: "bio"
        widget: "text"
        required: false
      - label: "Immagine profilo"
        name: "avatar"
        widget: "image"
        required: false
