backend:
  name: github
  repo: StE2808/rossodiserablog
  branch: main
  base_url: https://sveltia-cms-auth.s-vozzi.workers.dev

# publish_mode: editorial_workflow  (spento il 19/11/2026: «Salva» manda il pezzo al sito; gli approfondimenti restano anteprime nascoste finché «Esce sul sito» è spento)

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

locale: 'it'

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: "posts"
    label: "Articoli"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Layout"
        name: "layout"
        widget: "hidden"
        default: "post"
      - label: "Titolo"
        name: "title"
        widget: "string"
        required: true
        hint: "Titolo editoriale dell'articolo. Può essere creativo."
      - label: "Titolo SEO (opzionale)"
        name: "seo_title"
        widget: "string"
        required: false
        hint: "Max 60 caratteri. Se vuoto, usa il titolo normale. Scrivi quello che l'utente cercherebbe su Google."
      - label: "Meta Description"
        name: "description"
        widget: "text"
        required: false
        hint: "120-155 caratteri. Riassumi l'articolo con una frase che invogli al click. Includi la parola chiave principale."
      - label: "Data pubblicazione"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        required: true
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
        required: true
      - label: "Categoria"
        name: "category"
        widget: "select"
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
        required: true
      - label: "Tag"
        name: "tags"
        widget: "list"
        required: false
      - label: "Immagine copertina"
        name: "image"
        widget: "image"
        required: false
        hint: "Immagine principale. Dimensioni ideali: 1200x630px per social sharing."
      - label: "Didascalia immagine"
        name: "image_caption"
        widget: "string"
        required: false
        hint: "Testo che appare sotto l'immagine (opzionale)"
      - label: "Alt Text Immagine"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Descrivi l'immagine per non vedenti e motori di ricerca. Non ripetere il titolo, descrivi cosa si VEDE."
      - label: "Sunto"
        name: "excerpt"
        widget: "text"
        required: true
        hint: "Anteprima che appare nelle card del sito e nel feed RSS. Può essere più lungo della Meta Description."
      - label: "Parola Chiave Principale (promemoria)"
        name: "focus_keyword"
        widget: "string"
        required: false
        hint: "Per quale ricerca vuoi posizionarti? Usala in: titolo SEO, description, primo paragrafo, almeno un H2."
      - label: "Contenuto"
        name: "body"
        widget: "markdown"
        required: true
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - heading-four
          - quote
          - bulleted-list
          - numbered-list
          - code

  # GLI APPROFONDIMENTI (ex «numero del giovedì», 16-17/11/2026): scritti qui finiscono in _numeri/ come anteprima (/anteprima/<nome>/, noindex); con «Esce sul sito» e la data arrivata il workflow li sposta in _posts/approfondimenti/. Un modulo, il layout numero.html impagina da solo.
  - name: "numeri"
    label: "Approfondimenti"
    label_singular: "Approfondimento"
    description: "Ogni casella finisce in un punto preciso della pagina: [guarda lo schema](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg) (si apre in un'altra scheda)."
    folder: "_numeri"
    create: true
    slug: "{{slug}}"
    summary: "N. {{numero}} · {{title}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "numero" }
      - label: "Testo preparato con l'IA (facoltativo, il modo veloce)"
        name: "body"
        widget: "text"
        required: false
        hint: 'COME SI USA: 1) sotto «ECCO IL MIO ARTICOLO» incolla il tuo articolo; 2) seleziona tutto il testo di questa casella (clic dentro, poi Cmd+A) e copialo (Cmd+C); 3) incollalo in ChatGPT, Gemini, Grok o l''IA che preferisci; 4) quando risponde, copia la risposta, torna qui, cancella tutto e incolla la risposta al posto del prompt. Il testo dell''IA riempie la pagina da solo: i box qui sotto si possono lasciare vuoti, e le correzioni si fanno qui dentro. RICORDATI DI COMPILARE: il numero, il titolo, l''autore, la categoria, la foto di copertina e la seconda foto (con le loro descrizioni). Tema breve, titolo SEO, meta description e parola chiave li prende dal testo dell''IA. Quando è pronto: «Esce sul sito» e la data.'
        default: |
          Ti incollo sotto un mio articolo. Riorganizzalo nella struttura di un approfondimento di Rosso di Sera (rossodiserablog.it), nel formato qui sotto. Usa il mio testo: riordina, dividi e taglia, ma non cambiare il senso e non aggiungere idee mie che non ci sono.

          SCRIVI PER CHI LEGGE: il risultato va pubblicato così com'è. Mai frasi che parlano dell'articolo o di queste istruzioni («nel testo», «indicato nell'articolo», «risposta all'obiezione», «secondo l'autore»).

          I DATI: usa solo quelli del mio articolo, con le fonti che ho messo io. Non inventare mai numeri, date, nomi, citazioni o fonti. Se un dato non ha fonte, nella tabella scrivi solo il nome della fonte che cito, senza link.

          LA STRUTTURA
          - Titolo: meglio una domanda.
          - Apertura: 150-200 parole che portano dentro il tema.
          - Tre fasce, in quest'ordine: CAPIRE (chi, che cosa, spiegato da zero), VEDERE (come funziona, un caso concreto, almeno un dato in tabella, l'obiezione «allora è tutto...?»), PENSARE (le conclusioni possibili).
          - In ogni fascia da 2 a 4 blocchi. Ogni blocco: un titolo che si capisce da solo, 40-90 parole.
          - Almeno due blocchi hanno per titolo una domanda che la gente cerca su Google (finisce con «?»), con la risposta subito, in 40-60 parole.
          - Una «frase rossa»: la frase più forte del pezzo, massimo 12 parole (se serve accorciala), con una riga piccola sotto. In fondo a una fascia, di solito Capire.
          - Alla fine tre domande al posto delle conclusioni, la prima la più importante. Domande brevi, massimo 12 parole: devono restare in testa.

          IL FORMATO
          Rispondi solo con il testo qui sotto, dentro un unico blocco di codice. Sostituisci le parti tra parentesi. Le righe che cominciano con ## e ### e le parole prima dei due punti (Catenaccio:, Indice:, Numero: ...) restano identiche: il sito le usa per impaginare.

          ```
          Titolo: (il titolo)
          Tema breve: (due o tre parole, es. Il racket)
          Titolo SEO: (massimo 60 caratteri, con le parole che la gente cerca)
          Meta description: (120-155 caratteri: cosa trova chi legge)
          Parola chiave: (la ricerca principale su Google)
          Idea per la foto di copertina: (una scena in bianco e nero, con un solo dettaglio rosso, senza persone reali riconoscibili)

          Catenaccio: (una o due frasi sotto il titolo, massimo 25 parole)
          Il punto: (25-50 parole: la tesi detta in chiaro)

          ## Apertura: (titolo del tema)
          Sottotitolo: (una frase sotto il titolo del tema)

          (Primo paragrafo dell'apertura.)

          (Secondo paragrafo.)

          ## Capire: (titolo della fascia, con le parole che si cercano)
          Indice: (una riga che riassume la fascia, massimo 8 parole)
          Sommario: (prima voce, 3-6 parole); (seconda voce)

          ### (Titolo del blocco)
          (Testo del blocco.)

          ### (Una domanda che la gente si fa?)
          (Risposta.)

          ### Frase rossa
          (La frase forte,
          anche su due righe.)
          Sotto: (la riga piccola sotto la frase)

          ## Vedere: (titolo della fascia)
          Indice: (una riga)
          Sommario: (prima voce); (seconda voce)

          ### (Titolo del blocco)
          (Testo del blocco.)

          ### Allora (l'obiezione)?
          (La risposta all'obiezione.)

          ### Tabella: (titolo della tabella)
          Didascalia: (dove, quando, che unità di misura)

          Numero: (solo la cifra, es. 28,7)
          Unità: (es. miliardi di euro)
          Cosa: (che cosa misura questo numero)
          Fonte: [(nome della fonte)]((link)), (data)

          Numero: (cifra)
          Unità: (unità)
          Cosa: (che cosa misura)
          Fonte: [(nome)]((link)), (data)

          Limite: (i limiti di questi dati, in una frase)

          ## Pensare: (titolo della fascia)
          Indice: (una riga)
          Sommario: (prima voce); (seconda voce)

          ### (Titolo del blocco)
          (Testo del blocco.)

          ### (Titolo del blocco)
          (Testo del blocco.)

          ## Domande
          - (La prima domanda?)
          - (La seconda?)
          - (La terza?)
          ```

          Regole del formato:
          - Nella tabella ogni voce sono quattro righe (Numero, Unità, Cosa, Fonte), con una riga vuota tra una voce e l'altra. Da 2 a 5 voci.
          - Nel Sommario le voci si separano con il punto e virgola.
          - Si possono aggiungere o togliere blocchi ###, ma l'ordine Capire, Vedere, Pensare non cambia.

          ECCO IL MIO ARTICOLO:

          (cancella questa riga e incolla qui il tuo articolo)
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: true }
      - { label: "Tema in breve", name: "tema_breve", required: false, widget: "string", hint: "Due o tre parole per la testata, es. «Il racket»." }
      - { label: "Titolo (meglio una domanda)", name: "title", widget: "string", hint: "Dove va ogni casella: [schema della pagina](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg)" }
      - { label: "Titolo SEO", name: "seo_title", widget: "string", required: false, hint: "Max 60 caratteri, le parole che la gente cerca." }
      - { label: "Meta description", name: "description", required: false, widget: "text", hint: "120-155 caratteri." }
      - { label: "Parola chiave principale", name: "focus_keyword", widget: "string", required: false }
      - { label: "Esce sul sito", name: "pubblica", widget: "boolean", default: false, required: false, hint: "Spento: resta un'anteprima (la vedi solo tu, all'indirizzo /anteprima/...). Acceso: esce sul sito alla data qui sotto, entro un'ora. Controlla l'anteprima prima di accenderlo." }
      - { label: "Data di pubblicazione", name: "data_pubblicazione", widget: "datetime", format: "YYYY-MM-DD HH:mm", required: false, hint: "Giorno e ora in cui esce. Si può anche programmare: se è nel futuro, aspetta quel momento." }
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        hint: "L'argomento: l'approfondimento compare anche lì, oltre che in copertina e fra gli arretrati. Senza categoria non esce."
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
      - { label: "Catenaccio", name: "catenaccio", required: false, widget: "text", hint: "Una o due frasi sotto il titolo." }
      - { label: "Il punto", name: "punto", required: false, widget: "text", hint: "25-50 parole: la tesi del numero detta in chiaro. Serve a Google e alle IA." }
      - { label: "Foto di copertina", name: "image", required: false, widget: "image", hint: "La foto grande in copertina. La seconda va nella casella «Seconda foto» qui sotto." }
      - { label: "Descrizione della foto (alt)", name: "image_alt", required: false, widget: "string", hint: "Cosa si vede, non il titolo." }
      - { label: "La foto è generata", name: "image_generata", required: false, widget: "boolean", default: true, hint: "Aggiunge «Illustrazione generata» sotto la foto." }
      - { label: "Didascalia (se la foto è vera)", name: "image_caption", widget: "string", required: false }
      - { label: "Seconda foto (accanto alla frase rossa)", name: "foto2", widget: "image", required: false, hint: "Esce accanto alla frase rossa. Se c'è, vince sulla foto messa dentro i box della frase rossa." }
      - { label: "Seconda foto: descrizione (alt)", name: "foto2_alt", widget: "string", required: false, hint: "Cosa si vede." }
      - { label: "Seconda foto: è generata", name: "foto2_generata", widget: "boolean", default: true, required: false }
      - { label: "Seconda foto: didascalia e crediti (se è vera)", name: "foto2_didascalia", widget: "string", required: false, hint: "Es. Bot farm in Ucraina, 2022. Foto: Polizia nazionale ucraina, CC BY 4.0" }
      - { label: "Seconda foto: mostrala intera", name: "foto2_intera", widget: "boolean", default: false, required: false, hint: "Per le foto orizzontali: niente ritaglio, bande scure sopra e sotto." }
      - label: "Leggi anche"
        name: "leggi_anche"
        widget: "list"
        required: false
        max: 4
        hint: "Fino a quattro articoli. La categoria si mette da sola. Se vuoto, escono gli ultimi quattro articoli."
        fields:
          - { label: "Titolo", name: "titolo", required: false, widget: "string" }
          - { label: "Indirizzo", name: "url", required: false, widget: "string", hint: "Es. /la-strana-parabola-della-silicon-valley/" }
      - label: "Il tema (apertura)"
        name: "tema"
        required: false
        widget: "object"
        fields:
          - { label: "Titolo", name: "titolo", required: false, widget: "string" }
          - { label: "Catenaccio", name: "catenaccio", widget: "string", required: false }
          - { label: "Apertura", name: "apertura", required: false, widget: "markdown", buttons: [bold, italic, link], hint: "150-200 parole, la prima lettera diventa il capolettera." }
      - label: "Movimenti"
        name: "movimenti"
        required: false
        widget: "list"
        summary: "{{fields.nome}}"
        hint: "Di solito tre: Capire, Vedere, Pensare. I blocchi si numerano da soli."
        fields:
          - { label: "Nome", name: "nome", required: false, widget: "string", hint: "Capire, Vedere o Pensare." }
          - { label: "Titolo della fascia", name: "titolo", required: false, widget: "string", hint: "Es. «Capire: che cos'è il racket». È un H2: meglio con le parole che si cercano." }
          - { label: "Riga nell'indice", name: "indice", required: false, widget: "string" }
          - { label: "Voci nel sommario di copertina", name: "sommario", required: false, widget: "list", field: { label: "Voce", name: "voce", widget: "string", required: false } }
          - { label: "Colonne (computer)", name: "colonne", widget: "number", value_type: "int", max: 4, required: false, hint: "Se vuoto, una colonna per blocco." }
          - label: "Blocchi"
            name: "blocchi"
            required: false
            widget: "list"
            summary: "{{fields.titolo}}"
            fields:
              - { label: "Titolo", name: "titolo", required: false, widget: "string", hint: "Deve capirsi da solo. Se è una domanda, scegli il tipo «Domanda»." }
              - { label: "Tipo", name: "tipo", required: false, widget: "select", default: "testo", options: [{ label: "Testo", value: "testo" }, { label: "Domanda (diventa FAQ per Google)", value: "domanda" }] }
              - { label: "Testo", name: "testo", required: false, widget: "markdown", buttons: [bold, italic, link, numbered-list, bulleted-list], hint: "40-90 parole. Le domande: 40-60." }
          - label: "Dopo i blocchi"
            name: "dopo"
            widget: "list"
            required: false
            hint: "Facoltativo: una pagina rossa con una frase, o una tabella di dati."
            types:
              - label: "Frase rossa"
                name: "frase"
                required: false
                widget: "object"
                fields:
                  - { label: "Frase grande", name: "grande", required: false, widget: "text", hint: "Ogni a capo resta un a capo." }
                  - { label: "Sottotesto", name: "sotto", widget: "string", required: false }
                  - { label: "Foto accanto (la seconda foto del numero)", name: "image", widget: "image", required: false }
                  - { label: "Descrizione della foto (alt)", name: "image_alt", widget: "string", required: false }
                  - { label: "La foto è generata", name: "generata", required: false, widget: "boolean", default: true }
                  - { label: "Didascalia e crediti (foto vera)", name: "didascalia", widget: "string", required: false, hint: "Es. Bot farm in Ucraina, 2022. Foto: Polizia nazionale ucraina, CC BY 4.0" }
                  - { label: "Mostra la foto intera", name: "adatta", widget: "boolean", default: false, required: false, hint: "Per le foto orizzontali: niente ritaglio, bande scure sopra e sotto." }
              - label: "Tabella dati"
                name: "dati"
                required: false
                widget: "object"
                fields:
                  - { label: "Titolo", name: "titolo", required: false, widget: "string" }
                  - { label: "Didascalia", name: "didascalia", required: false, widget: "string", hint: "Dove, quando, che unità." }
                  - { label: "Intestazione prima colonna", name: "colonna", widget: "string", required: false, hint: "Es. Importo, Numero, Anno. Se vuota: Importo." }
                  - label: "Righe"
                    name: "righe"
                    required: false
                    widget: "list"
                    summary: "{{fields.cifra}} {{fields.unita}}"
                    fields:
                      - { label: "Cifra", name: "cifra", required: false, widget: "string", hint: "Es. 28,7" }
                      - { label: "Unità", name: "unita", required: false, widget: "string", hint: "Es. miliardi di euro" }
                      - { label: "Che cosa misura", name: "testo", required: false, widget: "text" }
                      - { label: "Fonte", name: "fonte", required: false, widget: "string", hint: "Fonte verificata sul testo originale; un link in markdown va bene." }
                  - { label: "Limiti dei dati", name: "limite", widget: "text", required: false }
      - { label: "Domande finali", name: "domande", required: false, widget: "list", max: 3, hint: "Tre, la prima grande. Al posto delle conclusioni.", field: { label: "Domanda", name: "domanda", widget: "string", required: false } }
      - label: "Articolo da cui nasce (facoltativo)"
        name: "articolo_origine"
        widget: "object"
        required: false
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false }
          - { label: "Indirizzo", name: "url", widget: "string", required: false }

  # APPROFONDIMENTI USCITI (17/11/2026): per correggere un approfondimento già pubblicato.
  # Il file sta in _posts/approfondimenti/ (lo sposta scripts/pubblica_approfondimenti.py); niente «Nuovo»: si crea da «Approfondimenti».
  - name: "approfondimenti_usciti"
    label: "Approfondimenti usciti"
    label_singular: "Approfondimento uscito"
    description: "Gli approfondimenti già pubblicati, per correggerli. Quelli nuovi si scrivono in «Approfondimenti»."
    folder: "_posts/approfondimenti"
    create: false
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "N. {{numero}} · {{title}}"
    fields:
      - label: "Testo preparato con l'IA (facoltativo, il modo veloce)"
        name: "body"
        widget: "text"
        required: false
        hint: 'COME SI USA: 1) sotto «ECCO IL MIO ARTICOLO» incolla il tuo articolo; 2) seleziona tutto il testo di questa casella (clic dentro, poi Cmd+A) e copialo (Cmd+C); 3) incollalo in ChatGPT, Gemini, Grok o l''IA che preferisci; 4) quando risponde, copia la risposta, torna qui, cancella tutto e incolla la risposta al posto del prompt. Il testo dell''IA riempie la pagina da solo: i box qui sotto si possono lasciare vuoti, e le correzioni si fanno qui dentro. RICORDATI DI COMPILARE: il numero, il titolo, l''autore, la categoria, la foto di copertina e la seconda foto (con le loro descrizioni). Tema breve, titolo SEO, meta description e parola chiave li prende dal testo dell''IA. Quando è pronto: «Esce sul sito» e la data.'
      - { label: "Numero", name: "numero", widget: "number", value_type: "int", required: true }
      - { label: "Tema in breve", name: "tema_breve", required: false, widget: "string", hint: "Due o tre parole per la testata, es. «Il racket»." }
      - { label: "Titolo (meglio una domanda)", name: "title", widget: "string", hint: "Dove va ogni casella: [schema della pagina](https://rossodiserablog.it/assets/images/numeri/guida-numero.jpg)" }
      - { label: "Titolo SEO", name: "seo_title", widget: "string", required: false, hint: "Max 60 caratteri, le parole che la gente cerca." }
      - { label: "Meta description", name: "description", required: false, widget: "text", hint: "120-155 caratteri." }
      - { label: "Parola chiave principale", name: "focus_keyword", widget: "string", required: false }
      - { label: "Data di uscita", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss ZZ", hint: "Messa dal sito quando è uscito: non cambiarla." }
      - label: "Autore"
        name: "author"
        widget: "select"
        options:
          - { label: "Lino Rialti", value: "lino-rialti" }
          - { label: "Stefano Vozzi", value: "stefano-vozzi" }
      - label: "Categoria"
        name: "category"
        widget: "select"
        hint: "L'argomento: l'approfondimento compare anche lì, oltre che in copertina e fra gli arretrati. Senza categoria non esce."
        options:
          - { label: "Politica italiana", value: "politica-interna" }
          - { label: "Esteri", value: "politica-estera" }
          - { label: "Società e diritti", value: "societa" }
          - { label: "Opinioni", value: "opinioni-editoriali" }
          - { label: "Scienza, tecnologia e ambiente", value: "scienza-tecnologia" }
          - { label: "Cultura", value: "cultura-spettacolo" }
          - { label: "Economia", value: "economia-finanza" }
      - { label: "Catenaccio", name: "catenaccio", required: false, widget: "text", hint: "Una o due frasi sotto il titolo." }
      - { label: "Il punto", name: "punto", required: false, widget: "text", hint: "25-50 parole: la tesi del numero detta in chiaro. Serve a Google e alle IA." }
      - { label: "Foto di copertina", name: "image", required: false, widget: "image", hint: "La foto grande in copertina. La seconda va nella casella «Seconda foto» qui sotto." }
      - { label: "Descrizione della foto (alt)", name: "image_alt", required: false, widget: "string", hint: "Cosa si vede, non il titolo." }
      - { label: "La foto è generata", name: "image_generata", required: false, widget: "boolean", default: true, hint: "Aggiunge «Illustrazione generata» sotto la foto." }
      - { label: "Didascalia (se la foto è vera)", name: "image_caption", widget: "string", required: false }
      - { label: "Seconda foto (accanto alla frase rossa)", name: "foto2", widget: "image", required: false, hint: "Esce accanto alla frase rossa. Se c'è, vince sulla foto messa dentro i box della frase rossa." }
      - { label: "Seconda foto: descrizione (alt)", name: "foto2_alt", widget: "string", required: false, hint: "Cosa si vede." }
      - { label: "Seconda foto: è generata", name: "foto2_generata", widget: "boolean", default: true, required: false }
      - { label: "Seconda foto: didascalia e crediti (se è vera)", name: "foto2_didascalia", widget: "string", required: false, hint: "Es. Bot farm in Ucraina, 2022. Foto: Polizia nazionale ucraina, CC BY 4.0" }
      - { label: "Seconda foto: mostrala intera", name: "foto2_intera", widget: "boolean", default: false, required: false, hint: "Per le foto orizzontali: niente ritaglio, bande scure sopra e sotto." }
      - label: "Leggi anche"
        name: "leggi_anche"
        widget: "list"
        required: false
        max: 4
        hint: "Fino a quattro articoli. La categoria si mette da sola. Se vuoto, escono gli ultimi quattro articoli."
        fields:
          - { label: "Titolo", name: "titolo", required: false, widget: "string" }
          - { label: "Indirizzo", name: "url", required: false, widget: "string", hint: "Es. /la-strana-parabola-della-silicon-valley/" }
      - label: "Il tema (apertura)"
        name: "tema"
        required: false
        widget: "object"
        fields:
          - { label: "Titolo", name: "titolo", required: false, widget: "string" }
          - { label: "Catenaccio", name: "catenaccio", widget: "string", required: false }
          - { label: "Apertura", name: "apertura", required: false, widget: "markdown", buttons: [bold, italic, link], hint: "150-200 parole, la prima lettera diventa il capolettera." }
      - label: "Movimenti"
        name: "movimenti"
        required: false
        widget: "list"
        summary: "{{fields.nome}}"
        hint: "Di solito tre: Capire, Vedere, Pensare. I blocchi si numerano da soli."
        fields:
          - { label: "Nome", name: "nome", required: false, widget: "string", hint: "Capire, Vedere o Pensare." }
          - { label: "Titolo della fascia", name: "titolo", required: false, widget: "string", hint: "Es. «Capire: che cos'è il racket». È un H2: meglio con le parole che si cercano." }
          - { label: "Riga nell'indice", name: "indice", required: false, widget: "string" }
          - { label: "Voci nel sommario di copertina", name: "sommario", required: false, widget: "list", field: { label: "Voce", name: "voce", widget: "string", required: false } }
          - { label: "Colonne (computer)", name: "colonne", widget: "number", value_type: "int", max: 4, required: false, hint: "Se vuoto, una colonna per blocco." }
          - label: "Blocchi"
            name: "blocchi"
            required: false
            widget: "list"
            summary: "{{fields.titolo}}"
            fields:
              - { label: "Titolo", name: "titolo", required: false, widget: "string", hint: "Deve capirsi da solo. Se è una domanda, scegli il tipo «Domanda»." }
              - { label: "Tipo", name: "tipo", required: false, widget: "select", default: "testo", options: [{ label: "Testo", value: "testo" }, { label: "Domanda (diventa FAQ per Google)", value: "domanda" }] }
              - { label: "Testo", name: "testo", required: false, widget: "markdown", buttons: [bold, italic, link, numbered-list, bulleted-list], hint: "40-90 parole. Le domande: 40-60." }
          - label: "Dopo i blocchi"
            name: "dopo"
            widget: "list"
            required: false
            hint: "Facoltativo: una pagina rossa con una frase, o una tabella di dati."
            types:
              - label: "Frase rossa"
                name: "frase"
                required: false
                widget: "object"
                fields:
                  - { label: "Frase grande", name: "grande", required: false, widget: "text", hint: "Ogni a capo resta un a capo." }
                  - { label: "Sottotesto", name: "sotto", widget: "string", required: false }
                  - { label: "Foto accanto (la seconda foto del numero)", name: "image", widget: "image", required: false }
                  - { label: "Descrizione della foto (alt)", name: "image_alt", widget: "string", required: false }
                  - { label: "La foto è generata", name: "generata", required: false, widget: "boolean", default: true }
                  - { label: "Didascalia e crediti (foto vera)", name: "didascalia", widget: "string", required: false, hint: "Es. Bot farm in Ucraina, 2022. Foto: Polizia nazionale ucraina, CC BY 4.0" }
                  - { label: "Mostra la foto intera", name: "adatta", widget: "boolean", default: false, required: false, hint: "Per le foto orizzontali: niente ritaglio, bande scure sopra e sotto." }
              - label: "Tabella dati"
                name: "dati"
                required: false
                widget: "object"
                fields:
                  - { label: "Titolo", name: "titolo", required: false, widget: "string" }
                  - { label: "Didascalia", name: "didascalia", required: false, widget: "string", hint: "Dove, quando, che unità." }
                  - { label: "Intestazione prima colonna", name: "colonna", widget: "string", required: false, hint: "Es. Importo, Numero, Anno. Se vuota: Importo." }
                  - label: "Righe"
                    name: "righe"
                    required: false
                    widget: "list"
                    summary: "{{fields.cifra}} {{fields.unita}}"
                    fields:
                      - { label: "Cifra", name: "cifra", required: false, widget: "string", hint: "Es. 28,7" }
                      - { label: "Unità", name: "unita", required: false, widget: "string", hint: "Es. miliardi di euro" }
                      - { label: "Che cosa misura", name: "testo", required: false, widget: "text" }
                      - { label: "Fonte", name: "fonte", required: false, widget: "string", hint: "Fonte verificata sul testo originale; un link in markdown va bene." }
                  - { label: "Limiti dei dati", name: "limite", widget: "text", required: false }
      - { label: "Domande finali", name: "domande", required: false, widget: "list", max: 3, hint: "Tre, la prima grande. Al posto delle conclusioni.", field: { label: "Domanda", name: "domanda", widget: "string", required: false } }
      - label: "Articolo da cui nasce (facoltativo)"
        name: "articolo_origine"
        widget: "object"
        required: false
        fields:
          - { label: "Titolo", name: "titolo", widget: "string", required: false }
          - { label: "Indirizzo", name: "url", widget: "string", required: false }

  - name: "authors"
    label: "Autori"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Nome completo"
        name: "name"
        widget: "string"
        required: true
      - label: "Username"
        name: "username"
        widget: "string"
        required: true
      - label: "Bio"
        name: "bio"
        widget: "text"
        required: false
      - label: "Immagine profilo"
        name: "avatar"
        widget: "image"
        required: false
